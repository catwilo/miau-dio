[project]
name = "miau-dio"
version = "0.1.0"
description = "Modular CLI for synthesizing and managing musical ideas"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.scripts]
miau-dio = "miau_dio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miau_dio"]
